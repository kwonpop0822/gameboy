name: Build Game Boy ROM with Docker Hub

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    # gstolarz가 빌드해 둔 최신 GBDK-2020 도커 컨테이너를 통째로 띄운다!!
    container:
      image: gstolarz/gbdk-2020:latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build ROM inside Container
      run: |
        make clean || true
        make

    - name: Upload ROM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tycoon-rom
        path: tycoon.gb
