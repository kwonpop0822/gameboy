name: Build Game Boy ROM

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Install SDCC and Make
      run: |
        sudo apt-get update
        sudo apt-get install -y sdcc make gbdk

    - name: Build ROM
      run: |
        make clean || true
        make

    - name: Upload ROM Artifact
      uses: actions/upload-artifact@v3
      with:
        name: tycoon-rom
        path: tycoon.gb
