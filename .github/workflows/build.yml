name: Build Game Boy ROM with Docker

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    # 공식 GBDK-2020 도커 이미지를 컨테이너로 직접 통째로 띄운다!!
    container:
      image: ghcr.io/gbdk-2020/gbdk-2020:latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build ROM inside Docker Container
      run: |
        make clean || true
        make

    - name: Upload ROM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tycoon-rom
        path: tycoon.gb
